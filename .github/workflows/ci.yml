name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Pico the tests were written and run with: a literal, like pico-gamepad, pico-mavlink and pico-serialport.
  PICO_VERSION: 0.5.1

jobs:
  ci:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, linux: true }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, linux: true }
          - { target: macos-arm64, runner: macos-15, linux: false }
          - { target: windows-x64, runner: windows-2025, linux: false }
          - { target: windows-arm64, runner: windows-11-arm, linux: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        # Explicitly bash, which GitHub runs with -eo pipefail: a failing test isn't hidden by tee.
        shell: bash
        # This repository is checked out next to its sibling `pico-gamepad` (project.json's `workspace` says `../pico-gamepad`).
        working-directory: sitl-transmitter
    steps:
      - uses: actions/checkout@v4
        with:
          path: sitl-transmitter
      - uses: actions/checkout@v4
        with:
          repository: padcom/pico-gamepad
          path: pico-gamepad
      - name: Install the pinned Pico
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails the job if the release is missing: nothing below is optional.
        run: |
          v=$PICO_VERSION
          case "${{ matrix.target }}" in windows-*) archive=zip ;; *) archive=tar.gz ;; esac
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-${{ matrix.target }}.$archive" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico"
          if [ "$archive" = zip ]; then
            unzip -q "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.zip" -d "$RUNNER_TEMP/pico"
            cygpath -w "$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico.exe | head -1)")" >> "$GITHUB_PATH"
          else
            tar -xzf "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pico"
            dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)" >> "$GITHUB_PATH"
          fi
      - name: Format
        run: |
          pico --version
          pico fmt --check .
      - name: Lint
        if: ${{ matrix.linux }}
        run: pico lint .
      # Off Linux the signal calls (libc's sigprocmask, isatty) can't be checked: signals.linux.pi names C calls that other systems lack;
      # there signals.pi stands in (nothing blocked, stdin not a terminal), and that is what is linted and built.
      - name: Lint (without the Linux-only files)
        if: ${{ !matrix.linux }}
        run: |
          echo "::warning::signals.linux.pi and signals.linux.test.pi aren't linted on ${{ matrix.target }}: Linux only."
          pico lint main.pi app.pi cli.pi channels.pi packet.pi gate.pi runner.pi sender.pi source.pi fakepad.pi devicesource.pi signals.pi testing.pi version.pi version.test.pi pad.test.pi channels.test.pi packet.test.pi gate.test.pi cli.test.pi fakepad.test.pi sender.test.pi devicesource.test.pi runner.test.pi app.test.pi
      - name: Tests
        if: ${{ matrix.linux }}
        run: |
          pico test . | tee "$RUNNER_TEMP/test.log"
          bash .github/tests-ran.sh "$RUNNER_TEMP/test.log"
      - name: Tests (without the Linux-only files)
        if: ${{ !matrix.linux }}
        run: |
          echo "::warning::signals.linux.test.pi is skipped on ${{ matrix.target }}: it needs Linux."
          pico test version.test.pi pad.test.pi channels.test.pi packet.test.pi gate.test.pi cli.test.pi fakepad.test.pi sender.test.pi devicesource.test.pi runner.test.pi app.test.pi | tee "$RUNNER_TEMP/test.log"
          bash .github/tests-ran.sh "$RUNNER_TEMP/test.log"
      - name: The program builds
        run: pico build main.pi -o "$RUNNER_TEMP/sitl-transmitter${{ startsWith(matrix.target, 'windows') && '.exe' || '' }}"
